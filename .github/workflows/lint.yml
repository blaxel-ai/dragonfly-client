name: Lint

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main, release-*]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          toolchain: 1.88.0

      - name: Run cargo fmt
        run: |
          # The api crate is a submodule of generated code, so format only the
          # crates this repository owns.
          cargo fmt $(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name | select(. != "dragonfly-api") | "-p " + .') -- --check

      - name: Run cargo clippy
        run: |
          cargo clippy --all --all-targets -- -D warnings
